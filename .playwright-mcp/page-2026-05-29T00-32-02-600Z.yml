    - 'heading "PM Critique: Product Strategy" [level=2] [ref=e443]'
    - paragraph [ref=e444]: What a senior PM would flag if they inherited Clio's product portfolio today — the real problems underneath the impressive metrics.
    - generic [ref=e445]:
      - generic [ref=e446]:
        - generic [ref=e447]:
          - generic [ref=e448]: "Critical Issue #1"
          - heading "The pricing trap is eroding the core" [level=3] [ref=e449]
          - paragraph [ref=e450]:
            - text: Clio's pricing has crept upward with each product addition, and the modular structure — pay more for workflows, pay more for AI, pay more for intake — creates a sense of feature-gating that frustrates existing users. A 5-attorney firm on a full stack pays 2× what MyCase charges for equivalent functionality. When smaller competitors close the feature gap (and they are), the price premium becomes indefensible.
            - strong [ref=e451]: Clio has not articulated a clear price-to-value narrative for its SMB base in the AI era.
        - generic [ref=e452]:
          - generic [ref=e453]: "Critical Issue #2"
          - heading "Five products with unclear integration seams" [level=3] [ref=e454]
          - paragraph [ref=e455]:
            - text: Manage, Grow, Draft, Work, Operate — five products acquired or built across 17 years, now positioned as a unified platform. The claim of "unified" is marketing; the UX reality is more like five different apps with a shared login. Users report needing to switch contexts, data doesn't flow automatically between modules, and enterprise integrations (Operate → Manage) are nascent.
            - strong [ref=e456]: The platform story is ahead of the platform reality.
        - generic [ref=e457]:
          - generic [ref=e458]: "Concern #3"
          - heading "SMB vs. enterprise tension is unresolved" [level=3] [ref=e459]
          - paragraph [ref=e460]: "Clio's go-to-market, product design, support model, and brand are optimized for small law firms — firms where one person is the lawyer, billing manager, and IT department. Operate and the $500M enterprise push require a different product motion: longer sales cycles, IT gatekeepers, procurement processes, compliance requirements. Clio is running both motions simultaneously with no announced organizational separation. This almost always causes the enterprise motion to underperform or the SMB experience to degrade."
        - generic [ref=e461]:
          - generic [ref=e462]: "Concern #4"
          - heading "AI differentiation requires proof, not claims" [level=3] [ref=e463]
          - paragraph [ref=e464]:
            - text: "Clio Work launched with compelling positioning. But the legal AI market has become brutally demanding about accuracy. Harvey and CoCounsel publish benchmark comparisons. Clio has published none. In a market where hallucinations in legal briefs can result in sanctions (see: the well-publicized cases of lawyers citing AI-fabricated case law), unverified AI claims are a liability."
            - strong [ref=e465]: Clio needs head-to-head accuracy data, not positioning copy.
      - generic [ref=e466]:
