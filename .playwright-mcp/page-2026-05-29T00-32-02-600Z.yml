  - generic [ref=e326]:
    - generic [ref=e327]: Section 04
    - heading "Technology Stack & Architecture" [level=2] [ref=e328]
    - paragraph [ref=e329]: Clio is a cloud-native SaaS platform. Its technical foundation was a competitive advantage in 2010 and is now table stakes — the differentiation has shifted to AI infrastructure and data moats.
    - generic [ref=e330]:
      - generic [ref=e331]:
        - heading "Core platform architecture" [level=3] [ref=e332]
        - paragraph [ref=e333]: Clio runs on a multi-tenant, cloud-native architecture built for horizontal scalability. The platform maintains SOC 2 Type II certification, with encryption at rest and in transit, 24/7/365 monitoring, and centralized identity management (SSO, RBAC).
        - paragraph [ref=e334]:
          - text: "The integration layer is the company's most strategically important architectural asset:"
          - strong [ref=e335]: 250+ pre-built integrations
          - text: and a public API that has spawned an ecosystem of 280+ app partners and 100 certified consultants. This creates switching costs — firms wire Clio into their accounting, e-signature, calendaring, and matter-filing workflows, making migration painful.
        - heading "Technology ecosystem" [level=4] [ref=e336]
