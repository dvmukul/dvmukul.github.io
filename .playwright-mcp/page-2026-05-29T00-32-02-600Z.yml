            - text: — Automates scheduling, communications, and billing. Court documents become calendar events; activity turns into client updates; expenses become draft invoices.
          - listitem [ref=e382]:
            - text: —
            - strong [ref=e383]: Clio Work (Vincent AI)
            - text: — Research, analysis, and multi-step agentic task execution grounded in 1B legal documents + live matter context.
          - listitem [ref=e384]:
            - text: —
