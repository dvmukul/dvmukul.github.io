  - generic [ref=e525]:
    - generic [ref=e526]: Section 07
    - 'heading "Mock Product Strategy: What Clio Should Do Next" [level=2] [ref=e527]'
    - paragraph [ref=e528]: A concrete, prioritized product strategy for FY2026–2027, written as if for Clio's CPO. Three strategic bets, nine tactical moves.
    - generic [ref=e529]:
      - heading "The strategic thesis" [level=3] [ref=e530]
      - paragraph [ref=e531]: "Clio has a window of roughly 18–24 months to convert its SMB distribution dominance into a defensible AI platform before Harvey and Thomson Reuters close the SMB gap from above and MyCase/PracticePanther close the value gap from below. The three bets: (1) weaponize the vLex corpus into a verifiably accurate AI research product, (2) create a unified product experience that earns the \"platform\" label, and (3) lock in enterprise legal departments before the legacy players replatform."
    - generic [ref=e532]:
      - generic [ref=e533]:
        - generic [ref=e534]: "01"
        - generic [ref=e535]: Launch "Clio Verified" accuracy benchmarks for Clio Work
        - generic [ref=e536]: Publish head-to-head accuracy comparisons against Harvey and CoCounsel on standard legal research benchmark suites (LegalBench, bar exam Q&A, case citation accuracy). In an era of hallucination anxiety, verified accuracy is a purchasing argument no competitor currently owns clearly in SMB. Legal AI buyers are trained to ask "can I trust this?" Clio needs to answer that question with data, not marketing copy.
        - generic [ref=e537]: H1 2026 · High priority
      - generic [ref=e538]:
        - generic [ref=e539]: "02"
        - generic [ref=e540]: Build a unified "matter intelligence" layer across all five products
        - generic [ref=e541]: Create a shared data layer — a single matter graph — that surfaces context across Manage, Grow, Draft, Work, and Operate without context switching. A client's intake form in Grow should auto-populate a Manage matter; research in Work should appear in Draft; billing anomalies in Manage should trigger workflow alerts. This is the product that earns the "Intelligent Legal Work Platform" name. Currently it doesn't exist.
        - generic [ref=e542]: H2 2026 · Critical
      - generic [ref=e543]:
        - generic [ref=e544]: "03"
        - generic [ref=e545]: Introduce practice-area AI bundles at a flat-per-firm price
        - generic [ref=e546]: Create vertically-tuned AI bundles for the top 5 practice areas (family law, immigration, real estate, personal injury, estate planning) that include tailored document templates, jurisdiction-specific research, and intake forms — priced per firm, not per user. This directly addresses the per-user pricing backlash, creates a clear upgrade narrative, and is defensible because Harvey won't build micro-practice-area workflows at SMB price points.
        - generic [ref=e547]: H2 2026 · High priority
      - generic [ref=e548]:
        - generic [ref=e549]: "04"
        - generic [ref=e550]: Accelerate international distribution with vLex's existing footprint
        - generic [ref=e551]: vLex serves courts and legal teams in 110+ countries. Clio Manage serves 130 countries but with thin localization. Use vLex's enterprise legal relationships as a Trojan horse for Clio Manage adoption in markets where Clio has no distribution. Target EU (Spain, UK, Germany) and Latin America first — vLex has deep coverage and relationships; Clio has product but no local GTM. This is a faster path than building from zero.
        - generic [ref=e552]: 2026–2027 · Strategic
      - generic [ref=e553]:
        - generic [ref=e554]: "05"
        - generic [ref=e555]: Build AI-powered billing intelligence into Manage
        - generic [ref=e556]: "Clio processes billions in legal transactions. That data is a goldmine for billing AI: predicting write-off risk before it happens, surfacing realization rate patterns by matter type, recommending optimal billing cadences, flagging scope creep on flat-fee matters. This is entirely proprietary — no competitor has this data at scale. A \"Billing Intelligence\" module would be a natural expansion of the payments flywheel and would speak directly to law firm economics pain."
        - generic [ref=e557]: H1 2027 · High potential
      - generic [ref=e558]:
        - generic [ref=e559]: "06"
        - generic [ref=e560]: Separate the SMB and enterprise product organizations
        - generic [ref=e561]: "Clio Operate targeting Fortune 500 legal departments needs a dedicated PM org, engineering team, and GTM motion that doesn't compete for resources with the 400K-user SMB base. The organizational tension is not just strategic — it's showing up in product quality signals (customer support degradation, onboarding complexity). Create two distinct product lines with separate P&Ls and surface them to investors clearly: \"Clio for Firms\" and \"Clio for Enterprise\"."
        - generic [ref=e562]: Now · Organizational
      - generic [ref=e563]:
        - generic [ref=e564]: "07"
        - generic [ref=e565]: Reduce onboarding time from 3–4 weeks to under 1 week
        - generic [ref=e566]: MyCase wins on simplicity. Clio loses accounts not because of missing features but because new users hit friction in week one and don't make it to week four. An AI-guided onboarding experience — "tell me about your practice; I'll configure Clio for you" — combined with migration tooling from the top 3 competitors could halve time-to-value. This is the highest-ROI retention investment available to the product team right now.
        - generic [ref=e567]: H1 2026 · Quick win
      - generic [ref=e568]:
        - generic [ref=e569]: "08"
        - generic [ref=e570]: Embed native accounting (or acquire a partner)
        - generic [ref=e571]: The absence of native accounting is the most-cited gap in user reviews. Every QuickBooks or Xero integration Clio facilitates is a churn vector — if a firm's accountant prefers a different tool, it creates friction on Clio's side. Either build lightweight trust accounting natively (Clio already has billing; accounting is a short hop) or make a targeted acquisition of a legal-specific accounting tool. This would close a hole that has existed for 10+ years.
        - generic [ref=e572]: 2027 · Close the gap
      - generic [ref=e573]:
        - generic [ref=e574]: "09"
        - generic [ref=e575]: Open a developer platform — "Clio App Store"
        - generic [ref=e576]: "Clio has 280 integration partners. It does not have an app marketplace with discovery, ratings, and direct monetization for developers. An App Store model — where legal tech builders pay a listing fee or revenue share to distribute on Clio's platform — would create a platform flywheel: more apps → more utility → lower churn → more users → more app demand. Salesforce, Shopify, and Atlassian built durable moats this way. Clio's installed base is large enough to support this now."
        - generic [ref=e577]: 2027 · Platform bet
