    - heading "Clio is the best-positioned company in legal tech history — and its most dangerous moment." [level=2] [ref=e655]:
      - text: Clio is the best-positioned company
      - text: in legal tech history — and its most dangerous moment.
    - paragraph [ref=e656]: The $1B vLex bet was bold and correct. The $500M ARR milestone is real. But the gap between Clio's platform narrative and its platform reality is growing, not shrinking. Harvey is moving up from AI-native. MyCase is moving up from value. Clio has 18 months to close the integration seams, prove Clio Work's accuracy, and define what "enterprise" actually means for a company built for the solo practitioner. The data moat is extraordinary. The question is execution.
