      - generic [ref=e61]:
        - heading "The Clio story in brief" [level=3] [ref=e62]
        - paragraph [ref=e63]: "Founded in 2008 by Jack Newton and Rian Gauvreau out of Vancouver, Clio addressed a painfully unsexy problem: lawyers were still billing by hand on paper and managing cases in spreadsheets. The founding insight — that a cloud-native practice management tool could replace the hodgepodge of desktop software and manila folders — turned out to be prescient."
        - paragraph [ref=e64]:
          - text: For a decade, Clio quietly compounded. It won the SMB legal market through relentless distribution (ClioCon, bar association partnerships, referral programs) and an expanding integration ecosystem. Revenue reached $235M ARR by end of 2024, then
          - strong [ref=e65]: accelerated sharply
          - text: — doubling in roughly 12 months to $500M by May 2026. That pace is not organic growth alone.
        - paragraph [ref=e66]:
          - text: The inflection point was the
          - strong [ref=e67]: $1 billion acquisition of vLex
          - text: in November 2025 — the largest deal in legal tech history. vLex brought over one billion primary legal documents, editorial enrichment, and Vincent AI, a GPT-powered legal research assistant. With one transaction, Clio moved from managing the business of law to powering the practice of law.
        - generic [ref=e68]:
          - strong [ref=e69]: "Critical observation:"
          - text: The $500M ARR milestone almost certainly includes vLex revenue. Without disaggregation, pure organic growth rates are opaque. Investors and analysts should demand segment-level ARR disclosure.
