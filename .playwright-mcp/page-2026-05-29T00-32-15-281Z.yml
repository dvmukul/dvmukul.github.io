      - generic [ref=e220]:
        - strong [ref=e221]: Critical Observation
        - text: Pigment is the most dangerous near-term competitor. Pigment wins the modern, design-conscious CFO — the very buyer Vena needs to acquire as it moves upmarket. Vena's Excel UI is functional but not delightful; Pigment's interface is. If Vena does not invest in UI modernization, it risks ceding the "aspirational" buyer to Pigment.
    - generic [ref=e222]:
      - generic [ref=e223]: § 03 — Product Analysis
      - heading "Core Platform & Technology Stack" [level=2] [ref=e224]
      - paragraph [ref=e225]: "Vena's platform is built around \"Complete Planning\" — budgeting, forecasting, scenario planning, reporting, financial close, and (now) consolidation. The defining architectural choice is Excel-native: users interact through Excel while CubeFLEX provides governance, workflow, and multidimensional data beneath the surface. This architecture is both Vena's primary moat and its ceiling for UX ambition."
      - heading "Technology Stack" [level=3] [ref=e226]
      - generic [ref=e227]:
        - generic [ref=e228]: CubeFLEX
        - generic [ref=e229]:
          - strong [ref=e230]: CubeFLEX — Proprietary OLAP Engine
          - paragraph [ref=e231]: In-memory multidimensional database purpose-built for financial planning. Provides multidimensional storage optimized for financial dimensions (time, entity, account, department, scenario), sparse data efficiency, and real-time recalculation for what-if scenario toggling. Complemented by relational databases (Amazon Redshift, Azure SQL Server, MongoDB) for large transactional volumes before aggregation into the OLAP layer.
      - generic [ref=e232]:
        - generic [ref=e233]: Azure Stack
        - generic [ref=e234]:
          - strong [ref=e235]: Microsoft Azure Infrastructure
          - paragraph [ref=e236]: Azure OpenAI powers Copilot and Planning Agent. Power BI native connector enables embedded dashboards without a separate BI tool purchase. Microsoft Teams surfaces Copilot for conversational access. Excel Add-in is the primary UI with two-way sync to CubeFLEX. Azure Marketplace / MACC allows customers to apply Azure Consumption Commitments to Vena licenses — a procurement flywheel advantage.
      - generic [ref=e237]:
        - generic [ref=e238]: Acterys
        - generic [ref=e239]:
          - strong [ref=e240]: Acterys (Acquired March 2026)
          - paragraph [ref=e241]: Enables Power BI write-back — non-finance users can input operational data (sales forecasts, headcount plans, ops inputs) directly in Power BI without touching Excel. Integrates with Microsoft Fabric. A bidirectional data layer launched May 2026 enables real-time flow between Acterys operational inputs and Vena financial models, forming the technical foundation of the "Orchestrated Planning" vision.
      - generic [ref=e242]:
        - generic [ref=e243]: AI Layer
        - generic [ref=e244]:
          - strong [ref=e245]: AI & Agent Layer
          - paragraph [ref=e246]: Vena Copilot provides conversational AI, natural language Q&A, and ad-hoc report generation via Azure OpenAI. Planning Agent (GA Sept 2025) is agentic AI that takes actions — generates forecasts, updates plan cells, and applies scenario logic without manual intervention. MCP Server (GA May 2026) is an open Model Context Protocol server that exposes governed Vena financial data to external AI tools including Claude, ChatGPT, and Microsoft Copilot.
      - generic [ref=e247]:
        - generic [ref=e248]: Integrations
        - generic [ref=e249]:
          - strong [ref=e250]: Integration Layer
          - paragraph [ref=e251]: "ERP and upstream data via REST APIs, native connectors, and iPaaS platforms (MuleSoft, Dell Boomi, Snaplogic). Bidirectional: actuals pull into CubeFLEX from ERP systems, and planning outputs push back to operational systems for downstream consumption. The bidirectionality is a competitive advantage over import-only tools that require manual data reconciliation."
