      - generic [ref=e128]: § 02 — Market Analysis
      - heading "Industry Landscape & Competitive Context" [level=2] [ref=e129]
      - heading "Market Context" [level=3] [ref=e130]
      - generic [ref=e131]:
        - generic [ref=e132]:
          - heading "📈 FP&A/CPM Market" [level=4] [ref=e133]
          - paragraph [ref=e134]: $5–6B in 2024, projected $16.9B by 2030 at ~15–18% CAGR. Growth driven by the shift from spreadsheet-only planning, CFO mandate expansion, AI embedding in financial workflows, real-time scenario planning demand, and increasing regulatory requirements.
        - generic [ref=e135]:
          - heading "🎯 Mid-Market Sweet Spot" [level=4] [ref=e136]
          - paragraph [ref=e137]: Vena targets $100M–$2B revenue companies with 10–200 finance staff. Large enough to have outgrown spreadsheet-only planning, not large enough for Anaplan or OneStream complexity. The segment is underserved by both ends of the market.
        - generic [ref=e138]:
          - heading "🤖 AI-Native Race" [level=4] [ref=e139]
          - paragraph [ref=e140]: "Every incumbent is embedding AI. Real differentiators: (a) AI grounded in company-specific data vs. generic LLMs; (b) agent (actions) vs. chatbot (answers); (c) natural language for non-finance users. Azure OpenAI is table stakes — the moat must live in the data layer."
      - heading "Industry Trends" [level=3] [ref=e141]
      - generic [ref=e142]:
        - generic [ref=e143]:
          - heading "AI-Native Planning" [level=4] [ref=e144]
