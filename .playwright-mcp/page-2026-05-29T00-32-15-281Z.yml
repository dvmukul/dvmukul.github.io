      - generic [ref=e57]: § 01 — Company Overview
      - heading "Who Is Vena Solutions?" [level=2] [ref=e58]
      - paragraph [ref=e59]: Toronto-based FP&A software company founded in 2011. Vena's platform is Excel-native, built on a proprietary CubeFLEX OLAP engine that provides governance, workflow, and multidimensional financial data beneath a familiar Excel interface. The company crossed $100M ARR (Centaur status) in 2024, representing a milestone that validated its Excel-native bet for the mid-market. Total funding stands at $476M, including a $300M Series C from Vista Equity Partners in 2021 — one of Canada's largest-ever SaaS rounds at the time.
      - paragraph [ref=e60]: In March 2026, Vena acquired Acterys, a Power BI write-back and operational planning platform, launching a new "Orchestrated Planning" category vision. In May 2026, the company launched Financial Consolidation (GA), Planning Agent GA, and an MCP Server — the most product-intensive quarter in the company's history.
      - generic [ref=e61]:
        - strong [ref=e62]: Core Thesis
        - text: Vena's Excel-native bet has proven commercially viable — but the same moat that built $100M ARR is the ceiling that limits the upmarket move. Implementation debt, Pigment's modern UX, and Microsoft's own AI ambitions are the three forces that will define Vena's next chapter.
