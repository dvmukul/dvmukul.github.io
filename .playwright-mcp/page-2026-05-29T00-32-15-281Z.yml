    - generic [ref=e295]:
      - generic [ref=e296]: § 04 — Customer Segments & Performance
      - heading "Who Buys Vena, Why They Stay, Why They Complain" [level=2] [ref=e297]
      - paragraph [ref=e298]: "Mid-market enterprises in the $100M–$2B revenue range, with finance teams of 10–200 people. Key verticals: Financial Services, Healthcare, Manufacturing, Technology, and Real Estate. The platform is largely horizontal — Vena does not ship pre-configured vertical data models, which is a strategic gap as competitors begin to verticalize their offerings."
      - heading "Core Problem Solved" [level=3] [ref=e299]
      - generic [ref=e300]:
        - strong [ref=e301]: Core Problem Solved
        - text: (1) Eliminates "spreadsheet hell" — disconnected Excel files, version control issues, formula errors, and manual consolidation across finance teams. (2) Gives CFOs a single source of truth with governance, workflow approvals, and audit trails. (3) Enables Finance to produce budget cycles faster without adding headcount. (4) Acterys extends this to operational departments — Sales, HR, and Ops feed data into financial models without touching the FP&A team's Excel environment.
      - heading "Customer Sentiment" [level=3] [ref=e302]
      - generic [ref=e303]:
        - generic [ref=e304]:
          - strong [ref=e305]: What Customers Love
          - list [ref=e306]:
            - listitem [ref=e307]: → Excel familiarity eliminates re-training — no change management overhead
            - listitem [ref=e308]: "→ Budgeting and forecasting depth: multi-scenario, driver-based, automated consolidation"
            - listitem [ref=e309]: → Customer support quality consistently praised during implementation
            - listitem [ref=e310]: → Power BI integration without a separate tool purchase
            - listitem [ref=e311]: "→ Workflow automation: month-end close, approval routing, task tracking"
        - generic [ref=e312]:
          - strong [ref=e313]: Persistent Complaints
          - list [ref=e314]:
            - listitem [ref=e315]: "→ Implementation is #1 complaint: marketed 8–10 weeks; reality is 4–8 months"
            - listitem [ref=e316]: → Performance degrades on large datasets — CubeFLEX limitations at scale
            - listitem [ref=e317]: → Report building requires expertise; non-technical users struggle
            - listitem [ref=e318]: → Account reconciliation underpowered vs. BlackLine, Trintech
            - listitem [ref=e319]: → ERP synchronization failures require manual intervention
            - listitem [ref=e320]: → Multi-year contract pressure before customers fully evaluate fit
      - generic [ref=e321]:
        - strong [ref=e322]: Data Point
        - text: Reddit analysis shows Vena has nearly twice as many negative comments as positive ones — a striking contrast to its 4.5/5 G2 rating (371 reviews). G2 skews toward people who successfully implemented; Reddit captures frustrated mid-implementation users. The gap is real and represents an important signal about implementation experience that aggregate star ratings obscure.
      - paragraph [ref=e323]: Vena crossed $100M ARR in 2024, up from approximately $60M in 2020 — roughly 67% growth over four years. Healthy for a mid-market SaaS company, but not hypergrowth. ARR/capital ratio of approximately 0.21x sits below top-quartile SaaS benchmarks (0.4–0.7x), consistent with Vista Equity's operating model of margin improvement over growth-at-all-costs capital deployment.
    - generic [ref=e324]:
      - generic [ref=e325]: § 05 — PM Critique
      - 'heading "Product Strategy Assessment: What''s Working, What''s at Risk" [level=2] [ref=e326]'
      - generic [ref=e327]:
        - generic [ref=e328]: ✦ Opportunity
        - generic [ref=e329]: The Excel-Native Moat Is Real and Underrated
        - generic [ref=e330]: Building on top of Excel rather than replacing it is the right long-term bet for the mid-market. Every competitor that asks finance teams to abandon Excel faces a change management tax Vena avoids. This is a genuine moat, not a legacy constraint. The CFO who has 15 analysts who live in Excel will choose Vena over a beautiful-but-foreign interface every time — as long as Vena keeps the governance and workflow tight.
      - generic [ref=e331]:
        - generic [ref=e332]: ✦ Opportunity
        - generic [ref=e333]: Microsoft Ecosystem Alignment Is a Strategic Multiplier
        - generic [ref=e334]: MACC channel, native Power BI embedding, Teams Copilot surface, and Dynamics 365 connector create a procurement and adoption flywheel that Salesforce-owned Anaplan cannot replicate. As enterprises centralize on Microsoft infrastructure, Vena becomes the obvious FP&A layer for the Microsoft-first CFO. This alignment compounds over time — every new Microsoft enterprise customer is a potential Vena motion.
      - generic [ref=e335]:
        - generic [ref=e336]: ✦ Opportunity
        - generic [ref=e337]: Acterys Acquisition Is Strategically Sound
        - generic [ref=e338]: "Bringing operational planning (Power BI write-back for Sales, HR, and Ops) into the Vena orbit is the right move. Acterys gives Vena a non-Excel surface for operational users who don't live in Finance, expanding seat count per account and making the platform stickier. The strategic logic is correct: Finance needs operational inputs, and Acterys removes the data collection bottleneck that makes every budget cycle a manual war."
      - generic [ref=e339]:
        - generic [ref=e340]: ✦ Opportunity
        - generic [ref=e341]: MCP Server Is Architecturally Forward-Looking
        - generic [ref=e342]: Opening Vena's governed data to external AI tools via Model Context Protocol positions Vena as the "finance data brain" regardless of which AI assistant the organization standardizes on. A CFO using Claude or ChatGPT can query Vena's financial data directly. This is a smart hedge against AI commoditization — Vena becomes infrastructure rather than a feature.
      - generic [ref=e343]:
        - generic [ref=e344]: ⚠ Risk
        - generic [ref=e345]: Implementation Is a Product Failure, Not a Services Failure
        - generic [ref=e346]: "Vena treats 4–6 month implementations as a customer success challenge. It is not. The product lacks: vertical-specific data model templates, guided onboarding with self-service configuration, and automated data migration tooling. Competitors are building accelerators; Vena ships a blank canvas. Implementation length is Vena's single biggest churn driver and sales objection — and it is fundamentally a product problem that can only be solved with product investment."
      - generic [ref=e347]:
        - generic [ref=e348]: ⚠ Risk
        - generic [ref=e349]: Excel as UX Is a Ceiling, Not Just a Floor
        - generic [ref=e350]: The same Excel familiarity that reduces change management prevents Vena from delivering a delightful experience. Pigment is winning the modern CFO because Pigment's interface communicates, not just calculates. At the executive and board level — where summary dashboards and scenario visualizations matter most — this gap is visible in every demo comparison. Vena's strength at the analyst level is a weakness at the CFO level.
      - generic [ref=e351]:
        - generic [ref=e352]: ◈ Gap
        - generic [ref=e353]: "\"Orchestrated Planning\" Is a Category Claim Without a Product Proof Point Yet"
        - generic [ref=e354]: Vena acquired Acterys in March 2026 and announced a unified data layer in May 2026 — two months of integration work. Marketing a new category while running ahead of product reality. Customers who buy the vision and find two loosely connected products will churn. Category vision without integration depth is a credibility risk, not a positioning win.
      - generic [ref=e355]:
        - generic [ref=e356]: ◈ Gap
        - generic [ref=e357]: AI Is Table Stakes, Not Differentiation
        - generic [ref=e358]: Vena Copilot and Planning Agent are built on Azure OpenAI — the same model every competitor uses. The real AI moat is in data quality, grounding, and proprietary training on financial planning behavior. Without depth in the CubeFLEX data model reasoning layer, Vena's AI is a checkbox feature. Every competitor will have the same bullet point on their website within 12 months.
      - generic [ref=e359]:
        - generic [ref=e360]: ◈ Gap
        - generic [ref=e361]: The Product Is Not Verticalized
        - generic [ref=e362]: A SaaS CFO wants ARR waterfall models, NRR calculations, and cohort churn forecasting out of the box. A Healthcare CFO wants pre-built department budget structures aligned to cost centers. Vena ships a blank canvas for every new customer. Planful and emerging upstarts are beginning to ship pre-built vertical models. This is a near-term vulnerability as the market matures past "does it work" to "how fast can we go live."
      - generic [ref=e363]:
        - generic [ref=e364]: ⚠ Risk
        - generic [ref=e365]: Microsoft Is Both Partner and Existential Threat
        - generic [ref=e366]: Microsoft Copilot for Finance — Excel-native, AI-powered, deeply integrated into Microsoft 365 — is directionally the same product as Vena's core offering. Microsoft has distribution, pricing leverage (bundled into E5/E3 suites), and zero marginal cost to bundle. Vena must build a durable differentiation layer — deep financial workflow, multi-entity consolidation, governed planning — before Microsoft decides to compete directly at scale. The partnership window is finite.
