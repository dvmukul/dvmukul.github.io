        - generic [ref=e146]:
          - heading "Category Expansion Beyond Finance" [level=4] [ref=e147]
          - paragraph [ref=e148]: Cross-functional "connected planning" is now table stakes. The Acterys acquisition is Vena's answer to extending beyond the Finance org to Sales, HR, and Operations.
        - generic [ref=e149]:
          - heading "Microsoft Ecosystem Alignment" [level=4] [ref=e150]
          - paragraph [ref=e151]: "MACC channel, Power BI, Teams, and Dynamics create a procurement flywheel. The headwind: Microsoft Copilot for Finance is a direct competitive threat from the same ecosystem."
        - generic [ref=e152]:
