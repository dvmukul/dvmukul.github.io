    - generic [ref=e122]:
      - generic [ref=e123]: § 02 — Market Analysis
      - heading "Industry Landscape & Competitive Positioning" [level=2] [ref=e124]
      - heading "Market Context" [level=3] [ref=e125]
      - paragraph [ref=e126]: "The global travel market is at an inflection point driven by three simultaneous forces: (1) post-pandemic pent-up demand keeping travel volumes high, (2) a platform shift from static search to agentic AI, and (3) generative AI disrupting the SEO-driven traffic model that currently funds most OTAs and travel metasearch businesses."
      - generic [ref=e127]:
        - generic [ref=e128]:
          - heading "Total Addressable Market" [level=4] [ref=e129]
          - paragraph [ref=e130]: Global packaged travel projected to reach $1.2T by 2033 (Strategic Revenue Insights). U.S. outbound travel alone at $293B in 2025 growing to $500B by 2035.
        - generic [ref=e131]:
          - heading "Traveler AI Adoption" [level=4] [ref=e132]
          - paragraph [ref=e133]: 80% of travelers already use AI tools for trip planning (Sabre/Phocuswright, 2026). 65% prefer brands that personalize via AI. ¼–⅓ of US/EU travelers now interested in agent-led booking.
        - generic [ref=e134]:
          - heading "Agentic Commerce" [level=4] [ref=e135]
          - paragraph [ref=e136]: Travel is shifting from discovery to autonomous action. Google is actively building agentic booking. Expedia and Booking.com embedding AI agents into core flows. 2026 is the consensus inflection year.
