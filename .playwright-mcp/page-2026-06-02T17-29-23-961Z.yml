        - generic [ref=e300]:
          - generic [ref=e301]: Critical Lens
          - paragraph [ref=e302]: LP calls its AI marketing suite "fully autonomous." The 500-person service layer exists precisely because the AI isn't reliable enough for client-facing real estate output without human review. User complaints about bulk-posted, generic AI blog content confirm the quality gap between the marketing claim and the delivered product.
    - heading "Presence CRM — What Differentiates It" [level=3] [ref=e303]
    - generic [ref=e304]:
      - generic [ref=e305]:
        - generic [ref=e306]: "Layer 1: Data Aggregation"
        - paragraph [ref=e307]: Pulls contacts, social followers, email/SMS history, website behavioral data, and legacy CRM exports into a unified contact graph. Auto-updates records and enriches with third-party signals — job changes, address updates, income proxies.
      - generic [ref=e308]:
        - generic [ref=e309]: "Layer 2: Predictive Intelligence"
        - paragraph [ref=e310]: Detects job promotions, new family members, income growth, and net worth increases that statistically precede real estate transactions. Surfaces deals in an agent's existing network before competitors know the contact is looking.
      - generic [ref=e311]:
        - generic [ref=e312]: "Layer 3: Prescriptive Action"
        - paragraph [ref=e313]: Tells the agent exactly who to contact, when, and with what message — then executes outreach autonomously if configured. Closes the loop from insight to action. If this works at scale, it's a genuine category-defining capability with no current equivalent.
