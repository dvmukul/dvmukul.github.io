  - generic [ref=e243]:
    - generic [ref=e244]: Technology & AI
    - heading "Genuine AI depth or marketing veneer?" [level=2] [ref=e245]
    - paragraph [ref=e246]: LP's AI investment is real and structurally ahead of most proptech competitors — but the gap between the marketing narrative and actual product capability deserves scrutiny.
    - generic [ref=e247]:
      - generic [ref=e248]:
        - heading "Core Technology Stack" [level=3] [ref=e249]
        - generic [ref=e250]:
          - generic [ref=e251]: Frontend / Web Platform
          - paragraph [ref=e252]: Agent websites run on a proprietary CMS delivering custom-branded, IDX-connected property search pages. Engineering job postings signal a modern React/Next.js frontend with global CDN delivery. Engineers are expected to ship production code with AI pair programming at velocity — this is a "use AI by default" engineering culture, not an optional practice.
        - generic [ref=e253]:
          - generic [ref=e254]: AI Infrastructure
          - paragraph [ref=e255]: Anthropic Claude is the primary LLM backbone. Job postings explicitly reference an "unlimited Anthropic token budget" and describe LP as "top 1% of companies applying AI." Models are trained on 100M+ annual platform interactions and billions of data points. AI agents handle SEO generation, social content, ad budget optimization, and autonomous lead nurture conversations.
        - generic [ref=e256]:
          - generic [ref=e257]: Data Layer
          - paragraph [ref=e258]: Presence CRM aggregates 270+ MLS feeds, social activity, communication logs, website behavioral data, and third-party enrichment (job changes, net worth signals, life events). This data moat is the real competitive asset — harder to replicate than any UI feature and requires years of time-in-market to build depth.
        - generic [ref=e259]:
          - generic [ref=e260]: Managed Service Layer
          - paragraph [ref=e261]: 500+ marketing and technology professionals operate as a managed service layer on top of the software. This human+AI hybrid delivers quality outcomes but creates margin pressure. LP is "nearly profitable" at $100M ARR — below SaaS benchmarks — because this labor cost hasn't been fully automated away.
      - generic [ref=e262]:
