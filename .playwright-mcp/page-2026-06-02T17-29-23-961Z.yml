    - generic [ref=e386]:
      - generic [ref=e387]:
        - heading "Where LP Wins" [level=3] [ref=e388]
        - list [ref=e389]:
          - listitem [ref=e390]:
            - text: "&#10003;"
            - strong [ref=e391]: "Design brand:"
            - text: No competitor approaches LP's visual quality at scale. High-end sellers evaluate agent websites as a proxy for how their property will be marketed — LP wins this signal war.
          - listitem [ref=e392]:
            - text: "&#10003;"
            - strong [ref=e393]: "Platform breadth:"
            - text: The only player combining website + CRM + SEO + social + ads + mobile AI in one subscription, creating a high-friction bundle to leave.
          - listitem [ref=e394]:
            - text: "&#10003;"
            - strong [ref=e395]: "Referral flywheel:"
            - text: 30% of top agents creates self-reinforcing network effects. Agents recruit peers for referral access, growing the network, attracting more top agents.
          - listitem [ref=e396]:
            - text: "&#10003;"
