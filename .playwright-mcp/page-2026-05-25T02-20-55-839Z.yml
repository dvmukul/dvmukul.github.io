      - generic [ref=e159]:
        - paragraph [ref=e160]: "My background is B2B SaaS — data infrastructure, enterprise IAM, platform architecture. I've worked at companies where the sales cycle is long, the compliance requirements are real, and \"move fast\" is not a strategy. That context shapes how I think about AI: not as a feature to ship, but as a system to govern."
        - paragraph [ref=e161]: My move into AI was deliberate. I spent months studying the actual capability curve before I led my first AI product. I've built agentic workflows, evaluation frameworks, and governance layers for enterprise deployment. I've seen what happens when teams skip the hard parts — trust architecture, data quality, edge-case behavior — and I know how to not do that.
        - paragraph [ref=e162]: Outside of product work, I'm working toward my private pilot license. It turns out that pre-flight checklists and pre-launch checklists have more in common than most people think.
