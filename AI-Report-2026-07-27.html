const CoverViz = () => {
  const dots = [];
  let s = 42;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  for (let i = 0; i < 28; i++) {
    const a = rnd() * Math.PI * 2;
    const r = 50 + rnd() * 170;
    dots.push(<circle key={i} cx={200 + Math.cos(a)*r} cy={200 + Math.sin(a)*r} r={1.3 + rnd()*2.6}
      fill={i%5===0 ? T.ink : T.mid} opacity={i%5===0 ? 1 : 0.45} />);
  }
  return (
    <svg viewBox="0 0 400 400" style={{ width: "100%", height: "100%" }}>
      {[70, 115, 160, 200].map(r => <circle key={r} cx={200} cy={200} r={r} fill="none" stroke={T.rule} strokeWidth="0.6" />)}
      <circle cx={200} cy={200} r={3} fill={T.ink} />
      {dots}
    </svg>
  );
};

// ─── APP ROOT ────────────────────────────────────────────────────
const { useState, useEffect } = React;

function App() {
  const [active, setActive] = useState("cover");

  useEffect(() => {
    const nav = document.getElementById("nav-bar");
    if (!nav) return;
    nav.innerHTML = "";
    PAGES.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "nav-btn" + (p.key === active ? " active" : "");
      btn.textContent = p.label;
      btn.onclick = () => {
        setActive(p.key);
        const el = document.getElementById("page-" + p.key);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      nav.appendChild(btn);
    });
  });

  useEffect(() => {
    const handleScroll = () => {
      const scrollY = window.scrollY + 120;
      let current = PAGES[0].key;
      PAGES.forEach(p => {
        const el = document.getElementById("page-" + p.key);
        if (el && el.offsetTop <= scrollY) current = p.key;
      });
      if (current !== active) setActive(current);
    };
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, [active]);

  return (
    <div id="report-root">
      {PAGES.map(p => (
        <div id={"page-" + p.key} key={p.key}>
          <p.Comp />
        </div>
      ))}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("report-root"));
</script>
